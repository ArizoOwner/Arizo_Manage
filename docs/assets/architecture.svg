<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Arizo Manage architecture</title>
  <desc id="d">One React + TypeScript codebase. On Android it runs in a Capacitor WebView over Kotlin plugins and SQLCipher; on iPhone it runs as an offline PWA over encrypted IndexedDB. Both read and write the same .arizo backup format. No server.</desc>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062E26"/>
      <stop offset="1" stop-color="#0D5C4B"/>
    </linearGradient>
    <linearGradient id="and" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1931"/>
      <stop offset="1" stop-color="#1B3B6F"/>
    </linearGradient>
    <linearGradient id="ios" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2418"/>
      <stop offset="1" stop-color="#5E4B2B"/>
    </linearGradient>
    <style>
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite }
      @keyframes flow { to { stroke-dashoffset: -28 } }
      .h { font: 800 22px 'Segoe UI', Inter, Arial, sans-serif; fill: #F4F7FB }
      .s { font: 400 15px 'Segoe UI', Inter, Arial, sans-serif; fill: #C9D3E2 }
      .k { font: 700 13px 'Segoe UI', Inter, Arial, sans-serif; letter-spacing: 1.5px; fill: #8E9BB0 }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>
  <rect width="1200" height="460" rx="28" fill="#06080D"/>

  <!-- shared core -->
  <rect x="390" y="30" width="420" height="150" rx="22" fill="url(#core)" stroke="#00D69F" stroke-opacity=".45"/>
  <text class="k" x="600" y="62" text-anchor="middle">ONE CODEBASE</text>
  <text class="h" x="600" y="96" text-anchor="middle">React 19 · TypeScript · Vite</text>
  <text class="s" x="600" y="126" text-anchor="middle">bigint ledger · SMS parser · analytics worker</text>
  <text class="s" x="600" y="150" text-anchor="middle">Argon2id + AES-256-GCM crypto worker</text>

  <path class="flow" d="M500 180 C500 230 260 220 260 262" fill="none" stroke="#4DA6FF" stroke-width="3"/>
  <path class="flow" d="M700 180 C700 230 940 220 940 262" fill="none" stroke="#E6C47A" stroke-width="3"/>

  <!-- Android -->
  <rect x="40" y="262" width="440" height="168" rx="22" fill="url(#and)" stroke="#4DA6FF" stroke-opacity=".45"/>
  <text class="k" x="260" y="294" text-anchor="middle">ANDROID · SIGNED APK</text>
  <text class="h" x="260" y="326" text-anchor="middle">Capacitor 7 + Kotlin plugins</text>
  <text class="s" x="260" y="356" text-anchor="middle">SQLCipher · Keystore / StrongBox · BiometricPrompt</text>
  <text class="s" x="260" y="380" text-anchor="middle">SMS + notification capture · PrintManager · ESC/POS</text>
  <text class="s" x="260" y="404" text-anchor="middle">FLAG_SECURE · WebView network firewall</text>

  <!-- iOS -->
  <rect x="720" y="262" width="440" height="168" rx="22" fill="url(#ios)" stroke="#E6C47A" stroke-opacity=".45"/>
  <text class="k" x="940" y="294" text-anchor="middle">IPHONE · OFFLINE PWA</text>
  <text class="h" x="940" y="326" text-anchor="middle">Safari "Add to Home Screen"</text>
  <text class="s" x="940" y="356" text-anchor="middle">Encrypted IndexedDB · Face ID via WebAuthn PRF</text>
  <text class="s" x="940" y="380" text-anchor="middle">Shortcuts SMS hand-off · AirPrint</text>
  <text class="s" x="940" y="404" text-anchor="middle">No App Store · no fee · no 7-day expiry</text>

  <!-- shared backup -->
  <rect x="510" y="312" width="180" height="68" rx="18" fill="#141B29" stroke="#fff" stroke-opacity=".15"/>
  <text class="h" x="600" y="342" text-anchor="middle" style="font-size:20px">.arizo</text>
  <text class="s" x="600" y="366" text-anchor="middle" style="font-size:13px">same backup, both ways</text>
  <path class="flow" d="M480 346 H510" fill="none" stroke="#4DA6FF" stroke-width="3"/>
  <path class="flow" d="M720 346 H690" fill="none" stroke="#E6C47A" stroke-width="3"/>

  <text class="k" x="600" y="446" text-anchor="middle" style="fill:#FF5C7A">NO SERVER · NO TELEMETRY · NO NETWORK</text>
</svg>
