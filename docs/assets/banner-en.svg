<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Arizo Manage</title>
  <desc id="d">Animated banner: an obsidian vault with an emerald and champagne-gold glow, the Arizo logo and the tagline "Your private wealth observatory".</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#0D111A"/>
      <stop offset="1" stop-color="#141B29"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E2B0"/>
      <stop offset="0.5" stop-color="#E6C47A"/>
      <stop offset="1" stop-color="#B8892D"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowE" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D69F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00D69F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6C47A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E6C47A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="logoClip"><path d="M150 96 L238 300 H200 L181 255 H119 L100 300 H62 Z M134 222 H166 L150 182 Z"/></clipPath>
    <style>
      .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .5s } .d3 { animation-delay: .8s } .d4 { animation-delay: 1.1s }
      @keyframes fade { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; transform-box: fill-box }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.12) } }
      .orbit { animation: spin 26s linear infinite; transform-origin: 150px 210px }
      @keyframes spin { to { transform: rotate(360deg) } }
      text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle class="pulse" cx="170" cy="210" r="210" fill="url(#glowE)"/>
  <circle class="pulse" cx="1060" cy="90" r="170" fill="url(#glowG)" style="animation-delay:2s"/>

  <g fill="#E6C47A">
    <circle cx="420" cy="360" r="2.5"><animate attributeName="cy" values="380;40" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="360" r="1.8"><animate attributeName="cy" values="400;20" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="360" r="2.2"><animate attributeName="cy" values="390;30" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#00D69F">
    <circle cx="520" cy="360" r="2"><animate attributeName="cy" values="400;10" dur="11s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="11s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="360" r="1.6"><animate attributeName="cy" values="400;60" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <g class="orbit">
    <circle cx="150" cy="210" r="128" fill="none" stroke="#E6C47A" stroke-opacity=".25" stroke-dasharray="2 10"/>
    <circle cx="278" cy="210" r="5" fill="#00D69F"/>
  </g>

  <path d="M150 96 L238 300 H200 L181 255 H119 L100 300 H62 Z M134 222 H166 L150 182 Z" fill="url(#gold)"/>
  <g clip-path="url(#logoClip)">
    <rect x="-80" y="80" width="70" height="240" fill="url(#sheen)" transform="skewX(-18)">
      <animate attributeName="x" values="-80;320" dur="3.6s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="150" cy="318" r="8" fill="#00D69F">
    <animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text class="fade d1" x="330" y="168" font-size="66" font-weight="800" fill="#F4F7FB" letter-spacing="-1">Arizo Manage</text>
  <text class="fade d2" x="332" y="214" font-size="26" font-weight="600" fill="url(#gold)">Your private wealth observatory</text>
  <text class="fade d3" x="332" y="262" font-size="19" fill="#8E9BB0">Offline-first · Zero-knowledge · Persian-first · Android APK + iPhone PWA</text>

  <g class="fade d4" font-size="15" font-weight="700">
    <rect x="332" y="296" width="152" height="38" rx="19" fill="#00D69F" fill-opacity=".14" stroke="#00D69F" stroke-opacity=".5"/>
    <text x="408" y="321" text-anchor="middle" fill="#00D69F">AES-256-GCM</text>
    <rect x="496" y="296" width="132" height="38" rx="19" fill="#E6C47A" fill-opacity=".14" stroke="#E6C47A" stroke-opacity=".5"/>
    <text x="562" y="321" text-anchor="middle" fill="#E6C47A">Argon2id</text>
    <rect x="640" y="296" width="132" height="38" rx="19" fill="#4DA6FF" fill-opacity=".14" stroke="#4DA6FF" stroke-opacity=".5"/>
    <text x="706" y="321" text-anchor="middle" fill="#4DA6FF">SQLCipher</text>
    <rect x="784" y="296" width="154" height="38" rx="19" fill="#FF5C7A" fill-opacity=".14" stroke="#FF5C7A" stroke-opacity=".5"/>
    <text x="861" y="321" text-anchor="middle" fill="#FF5C7A">0 trackers</text>
  </g>

  <path d="M950 300 C990 280 1010 290 1040 250 S1090 210 1120 180 S1150 160 1170 150" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="320" stroke-dashoffset="320">
    <animate attributeName="stroke-dashoffset" values="320;0" dur="2.2s" begin="1.2s" fill="freeze"/>
  </path>
  <circle cx="1170" cy="150" r="0" fill="#00D69F">
    <animate attributeName="r" values="0;7;5" dur=".6s" begin="3.3s" fill="freeze"/>
  </circle>
  <rect x="0" y="0" width="1200" height="420" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
